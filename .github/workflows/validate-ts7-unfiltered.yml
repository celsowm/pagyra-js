name: Unfiltered TypeScript 7 validation

on:
  push:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and type-check with TypeScript 7
        shell: bash
        run: |
          set +e
          {
            echo "===== npm ci ====="
            npm ci
            echo "NPM_CI_STATUS=$?"
            echo
            echo "===== npm run check ====="
            npm run check
            echo "TSC7_STATUS=$?"
          } > ts7-unfiltered.log 2>&1

      - name: Commit result and clean validation infrastructure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-ts7-unfiltered.yml
          git rm -f .github/ts7-unfiltered.trigger
          git rm -f .github/workflows/validate-ts7-package.yml
          git rm -f .github/workflows/validate-typescript-7.yml .github/typescript7-validation.trigger
          git rm -f .github/workflows/validate-ts7-fast.yml .github/ts7-fast.trigger
          git add ts7-unfiltered.log
          git commit -m "test: record unfiltered TypeScript 7 validation"
          git push
