name: Validate pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: TypeScript 7
        run: npm run check
      - name: TypeScript 6 compatibility
        run: npm run check:ts6
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  signed-document-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - run: npm ci
      - name: Generate and validate signed-document PDF preview
        run: npm test -- tests/pdf/signed-document-consumer.spec.ts
        env:
          PAGYRA_PDF_PREVIEW_DIR: ${{ runner.temp }}/pagyra-pdf-previews
      - name: Upload rendered PDF page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-document-preview
          path: ${{ runner.temp }}/pagyra-pdf-previews/signed-document-preview.png
          if-no-files-found: ignore

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - run: npm ci
      - name: Audit production and development dependency graph
        shell: bash
        run: |
          npm audit --json > audit-report.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
          console.log('AUDIT_SUMMARY', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, entry] of Object.entries(audit.vulnerabilities ?? {})) {
            const via = (entry.via ?? []).map(v => typeof v === 'string' ? v : ({
              name: v.name, title: v.title, severity: v.severity,
              range: v.range, url: v.url,
            }));
            console.log('AUDIT_ENTRY', JSON.stringify({
              name, severity: entry.severity, direct: entry.isDirect,
              via, range: entry.range, fixAvailable: entry.fixAvailable,
              effects: entry.effects,
            }));
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
