name: Validate TypeScript 7 migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-typescript-7.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check with TypeScript 7
        run: npm run check

      - name: Compatibility check with TypeScript 6
        run: npm run check:ts6

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Remove successful one-shot workflow
        run: git rm .github/workflows/validate-typescript-7.yml

      - name: Record successful validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: confirm TypeScript 7 migration"
          git push
