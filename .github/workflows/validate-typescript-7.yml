name: Capture TypeScript 7 validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-typescript-7.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run validation and capture diagnostics
        shell: bash
        run: |
          set +e
          report=typescript7-validation.log
          : > "$report"

          run_check() {
            name="$1"
            shift
            echo "===== $name =====" >> "$report"
            "$@" >> "$report" 2>&1
            status=$?
            echo "EXIT_STATUS=$status" >> "$report"
            echo >> "$report"
          }

          run_check "npm ci" npm ci
          run_check "TypeScript 7" npm run check
          run_check "TypeScript 6 compatibility" npm run check:ts6
          run_check "ESLint" npm run lint
          run_check "Vitest" npm test
          run_check "Build" npm run build

      - name: Commit diagnostics and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-typescript-7.yml
          git add typescript7-validation.log
          git commit -m "test: record TypeScript 7 migration diagnostics"
          git push
