name: Publish npm package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ignore obsolete main commits
        id: current
        shell: bash
        run: |
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; its workflow will publish instead."
          fi

      - uses: actions/setup-node@v6
        if: steps.current.outputs.is_latest == 'true'
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install an OIDC-capable npm CLI
        if: steps.current.outputs.is_latest == 'true'
        run: npm install --global npm@11

      - name: Validate, test and build
        if: steps.current.outputs.is_latest == 'true'
        id: validation
        shell: bash
        run: |
          set +e
          LOG_FILE="npm-publish-validation.log"
          : > "$LOG_FILE"
          FAILED=0

          run_step() {
            local name="$1"
            shift
            echo "===== $name =====" | tee -a "$LOG_FILE"
            "$@" 2>&1 | tee -a "$LOG_FILE"
            local status=${PIPESTATUS[0]}
            echo "EXIT_STATUS=$status" | tee -a "$LOG_FILE"
            echo | tee -a "$LOG_FILE"
            if [[ $status -ne 0 ]]; then
              FAILED=1
            fi
          }

          run_step "npm ci" npm ci
          if [[ $FAILED -eq 0 ]]; then run_step "TypeScript 7" npm run check; fi
          if [[ $FAILED -eq 0 ]]; then run_step "TypeScript 6 compatibility" npm run check:ts6; fi
          if [[ $FAILED -eq 0 ]]; then run_step "ESLint" npm run lint; fi
          if [[ $FAILED -eq 0 ]]; then run_step "Vitest" npm test; fi
          if [[ $FAILED -eq 0 ]]; then run_step "Build" npm run build; fi
          if [[ $FAILED -eq 0 ]]; then run_step "Package inspection" npm pack --dry-run; fi

          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Record validation failure on main
        if: steps.current.outputs.is_latest == 'true' && steps.validation.outputs.failed == '1'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f npm-publish-validation.log
          git commit -m "ci: record npm publish validation failure [skip ci]"
          git push origin HEAD:main

      - name: Stop after validation failure
        if: steps.current.outputs.is_latest == 'true' && steps.validation.outputs.failed == '1'
        run: exit 1

      - name: Select release version
        if: steps.current.outputs.is_latest == 'true' && steps.validation.outputs.failed == '0'
        id: release
        shell: bash
        run: |
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view pagyra-js version 2>/dev/null || true)"

          NEXT_VERSION="$(node --input-type=commonjs - "$CURRENT_VERSION" "$PUBLISHED_VERSION" <<'NODE'
          const current = process.argv[2];
          const published = process.argv[3];

          function parse(version) {
            const match = /^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/.exec(version ?? "");
            return match ? match.slice(1, 4).map(Number) : null;
          }

          function compare(left, right) {
            for (let index = 0; index < 3; index++) {
              if (left[index] !== right[index]) return left[index] - right[index];
            }
            return 0;
          }

          const currentParts = parse(current);
          if (!currentParts) throw new Error(`Invalid package version: ${current}`);

          const publishedParts = parse(published);
          if (!publishedParts || compare(currentParts, publishedParts) > 0) {
            process.stdout.write(current);
          } else {
            process.stdout.write(
              `${publishedParts[0]}.${publishedParts[1]}.${publishedParts[2] + 1}`,
            );
          }
          NODE
          )"

          npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing pagyra-js@$NEXT_VERSION"

      - name: Publish with npm trusted publishing
        if: steps.current.outputs.is_latest == 'true' && steps.validation.outputs.failed == '0'
        id: publish
        shell: bash
        run: |
          set +e
          npm publish --access public 2>&1 | tee npm-publish.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record npm publish failure on main
        if: steps.current.outputs.is_latest == 'true' && steps.validation.outputs.failed == '0' && steps.publish.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f npm-publish.log
          git commit -m "ci: record npm publish failure [skip ci]"
          git push origin HEAD:main

      - name: Stop after npm publish failure
        if: steps.current.outputs.is_latest == 'true' && steps.validation.outputs.failed == '0' && steps.publish.outputs.status != '0'
        run: exit 1

      - name: Record published version on main
        if: steps.current.outputs.is_latest == 'true' && steps.validation.outputs.failed == '0' && steps.publish.outputs.status == '0'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f npm-publish-validation.log npm-publish.log
          git rm -f npm-publish-validation.log npm-publish.log 2>/dev/null || true
          git add package.json package-lock.json
          git commit -m "chore: release v$VERSION [skip ci]"
          git push origin HEAD:main
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
