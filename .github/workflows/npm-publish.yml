name: Publish npm package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11

      - name: Verify publishing toolchain
        shell: bash
        run: |
          node --version
          NPM_VERSION="$(npm --version)"
          echo "$NPM_VERSION"
          node --input-type=commonjs - "$NPM_VERSION" <<'NODE'
          const [major, minor, patch] = process.argv[2].split(".").map(Number);

          if (
            major < 11 ||
            (major === 11 && minor < 5) ||
            (major === 11 && minor === 5 && patch < 1)
          ) {
            throw new Error("Trusted publishing requires npm 11.5.1 or newer.");
          }
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source
        run: npm run validate

      - name: Check whether this is still the latest main commit
        id: current
        shell: bash
        run: |
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; its workflow will publish instead."
          fi

      - name: Select and apply release version
        if: steps.current.outputs.is_latest == 'true'
        id: release
        shell: bash
        run: |
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view pagyra-js version 2>/dev/null || true)"

          NEXT_VERSION="$(node --input-type=commonjs - "$CURRENT_VERSION" "$PUBLISHED_VERSION" <<'NODE'
          const current = process.argv[2];
          const published = process.argv[3];

          function parse(version) {
            const match = /^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/.exec(version ?? "");
            return match ? match.slice(1, 4).map(Number) : null;
          }

          function compare(left, right) {
            for (let index = 0; index < 3; index++) {
              if (left[index] !== right[index]) {
                return left[index] - right[index];
              }
            }
            return 0;
          }

          const currentParts = parse(current);
          if (!currentParts) {
            throw new Error(`Invalid package version: ${current}`);
          }

          const publishedParts = parse(published);
          if (!publishedParts || compare(currentParts, publishedParts) > 0) {
            process.stdout.write(current);
          } else {
            process.stdout.write(
              `${publishedParts[0]}.${publishedParts[1]}.${publishedParts[2] + 1}`,
            );
          }
          NODE
          )"

          npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing pagyra-js@$NEXT_VERSION"

      - name: Build release artifacts
        if: steps.current.outputs.is_latest == 'true'
        run: npm run build

      - name: Inspect package contents
        if: steps.current.outputs.is_latest == 'true'
        run: npm pack --dry-run

      - name: Record release version on main
        if: steps.current.outputs.is_latest == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore: release v${{ steps.release.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish with npm trusted publishing
        if: steps.current.outputs.is_latest == 'true'
        run: npm publish --access public

      - name: Tag published version
        if: steps.current.outputs.is_latest == 'true'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag -a "v$VERSION" -m "Release v$VERSION"
          fi
          git push origin "v$VERSION"
