name: Package-triggered TypeScript 7 validation

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Capture validation
        shell: bash
        run: |
          set +e
          report=typescript7-validation.log
          : > "$report"
          for command in \
            "npm ci" \
            "npm run check" \
            "npm run check:ts6" \
            "npm run lint" \
            "npm test" \
            "npm run build"
          do
            echo "===== $command =====" >> "$report"
            bash -lc "$command" >> "$report" 2>&1
            echo "EXIT_STATUS=$?" >> "$report"
            echo >> "$report"
          done

      - name: Commit diagnostics and clean temporary validation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-ts7-package.yml
          git rm -f .github/workflows/validate-typescript-7.yml .github/typescript7-validation.trigger
          git rm -f .github/workflows/validate-ts7-fast.yml .github/ts7-fast.trigger
          git add typescript7-validation.log
          git commit -m "test: record TypeScript 7 migration diagnostics"
          git push
